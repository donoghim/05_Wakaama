services:
  wakaama:
    build:
      context: .
    image: wakaama-dashboard:local
    environment:
      PUBLIC_ENDPOINT: ${PUBLIC_ENDPOINT:?Set PUBLIC_ENDPOINT to the public IP address or FQDN used by devices}
      WAKAAMA_BOOTSTRAP_PORT: "22101"
      WAKAAMA_LWM2M_PORT: "22102"
      WAKAAMA_DFOTA_HOST: ${DFOTA_HOST:-${PUBLIC_ENDPOINT}}
      WAKAAMA_DFOTA_URI_PREFIX: ${DFOTA_URI_PREFIX:-/dfota_fw}
      WAKAAMA_COMMERCIAL_SERVER_MODE: ${WAKAAMA_COMMERCIAL_SERVER_MODE:-1}
      PUID: ${PUID:-1001}
      PGID: ${PGID:-1001}
    ports:
      - "${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-8080}:8080/tcp"
      - "${BOOTSTRAP_HOST_PORT:-22101}:22101/udp"
      - "${LWM2M_HOST_PORT:-22102}:22102/udp"
    volumes:
      - ./docker-data:/data
    restart: unless-stopped